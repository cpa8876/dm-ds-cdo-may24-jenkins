#### 1. Create a ConfigMap for NGINX Configuration: Create a file named `configmap.yaml` in the `nginx-proxy/templates` directory:
################################
################ #  Minikube_B12-10-02) github/charts/stable/nextcloud/templates/nginx-config.yaml
### https://github.com/helm/charts/blob/master/stable/nextcloud/templates/nginx-config.yaml
#### nginx-config.yaml
################################
# ################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginxconfig
data:
  nginx.conf: |
  {{- if .Values.nginx.config.default }}
    server {
           listen       80;
           Listen  [::]:80;
           server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;
           location / {
               root   /usr/share/nginx/html;
               index  index.html index.htm;
           }
           location /api/v1/movies {
                proxy_pass http://movie-fastapi-service:5000/api/v1/movies/docs;
                # proxy_pass http://{{ .Values.movie_service.host }}:{{ .Values.movie_service.port }}{{ .Values.movie_service.path }};
           }
           location /api/v1/casts {
                proxy_pass http://cast-fastapi-service:5001/api/v1/casts/docs;
                # proxy_pass http://{{ .Values.cast_service.host }}:{{ .Values.cast_service.port }}{{ .Values.cast_service.path }};
           }
    

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
           error_page   500 502 503 504  /50x.html;
           location = /50x.html {
               root   /usr/share/nginx/html;
           } 


           # proxy the PHP scripts to Apache listening on 127.0.0.1:80
           
