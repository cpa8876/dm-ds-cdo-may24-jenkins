## Search Brave with words : Deploy nginx on port 8080 helm
### https://search.brave.com/search?q=Deploy+nginx+on+port+8080+helm&summary=1&conversation=d49e0204c1c20b7bb0fb8c
#### Create an Ingress resource: Create an Ingress resource to route traffic to your application. 
#### For example, create a file named nginx-ingress.yaml with the following content:
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-develop
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-develop-svc
                port:
                  number: 80
---
